# Sigma rule: detects a scheduled task being created.
#
# Windows logs event 4698 every time a scheduled task is created. Attackers
# use tasks to run code again after a reboot. This rule alerts on the event,
# but skips tasks created by machine accounts to cut down on noise.
title: Scheduled Task Created
id: 0a1b2c3d-2222-4a6e-9f00-000000000002 # unique id for this rule
status: experimental # not yet tested in a real environment
description: Detects creation of a scheduled task, which attackers use for persistence.
author: practice project (AI-generated)
date: 2026-11-07
logsource:
  product: windows
  service: security # the Windows Security event log
detection:
  # Match the "task created" event.
  selection:
    EventID: 4698
  # Skip tasks created by machine accounts (their names end in $).
  filter_system:
    SubjectUserName|endswith: '$'
  # Alert on task creation, unless the filter matched.
  condition: selection and not filter_system
falsepositives:
  - Software installers that create scheduled tasks
level: low # how urgent a match is, for triage
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1053.005
