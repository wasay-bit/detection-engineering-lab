title: Encoded PowerShell Command Execution
id: 0a1b2c3d-1111-4a6e-9f00-000000000001
status: experimental
description: Detects PowerShell started with an encoded command argument, a common obfuscation technique.
author: practice project (AI-generated)
date: 2026-11-07
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\\powershell.exe'
      - '\\pwsh.exe'
  selection_flags:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -ec '
  condition: selection_image and selection_flags
falsepositives:
  - Admin scripts that use encoded commands
level: medium
tags:
  - attack.execution
  - attack.t1059.001
